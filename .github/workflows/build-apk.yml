name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk walkingpad-sync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: walkingpad-sync-apk
          path: walkingpad-sync.apk

      - name: Publish APK to the latest release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest walkingpad-sync.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --notes "Automatic APK build of commit ${GITHUB_SHA::7}."

      - name: Publish APK to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" walkingpad-sync.apk \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes
